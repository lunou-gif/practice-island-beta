<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Practice Island">
<meta name="theme-color" content="#FFF1C9">
<meta name="description" content="Free home practice for kids' mouth exercises: watch the move, use the mirror, earn treasure and build an island.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pixelify+Sans:wght@500;700&display=swap">
<title>Practice Island</title>
<style>
/* VOICE   occasion: a children's home-practice game, bright and friendly but calm enough to focus on one move at a time
   IDEA    a pocket island the child grows tile by tile, like a sticker map that fills in after every practice
   PICTURE the child's own isometric island, drawn live with their buddy walking on it; a cartoon coach face that shows each move
   COLOUR  by age: butter, sea blue and tomato for 4-5; deep lagoon teal and orange for 6-8; sky blue, grass green and chunky ink for 9+
   TYPE    Fredoka for everything kid-facing; Pixelify Sans headings for the 9+ look; the system sans for grown-ups
   LAYOUT  phone: title, picture, controls stacked; iPad landscape: island left and practice right; exercise: demo beside mirror */
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);color-scheme:light;
--bg:#FFF1C9;--gink:#3B2A20;--ink:#3B2A20;--muted:#7A6252;--card:#FFFFFF;--soft:#FFF5DC;--line:#F0DDB0;--pri:#F2552C;--pri-ink:#FFFFFF;--acc:#FFC531;--acc-ink:#3B2A20;--ok:#21B573;
--r:26px;--rs:18px;--edge:0 6px 0 rgba(150,90,20,.18);--bw:0px;--bc:transparent;
--disp:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,sans-serif;--body:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
--ground:radial-gradient(circle at 94% -30px,#FFE07A 0 120px,rgba(255,224,122,0) 121px),#FFF1C9}
:root[data-tier=explorer]{--bg:#0F6E78;--gink:#FFFFFF;--ink:#14323A;--muted:#557079;--soft:#E7F4F4;--line:#D3E6E8;--pri:#FF9F1C;--pri-ink:#14323A;--acc:#FFD43B;--acc-ink:#14323A;--r:22px;--rs:16px;--edge:0 5px 0 rgba(0,30,35,.3);--ground:linear-gradient(180deg,#13808A 0%,#0C5960 100%)}
:root[data-tier=builder]{--bg:#8ED3FF;--gink:#1E1A16;--ink:#1E1A16;--muted:#5B5048;--soft:#EAF4FA;--line:#C9D9E3;--pri:#62C44A;--pri-ink:#1E1A16;--acc:#F7C531;--acc-ink:#1E1A16;--r:6px;--rs:4px;--edge:0 4px 0 #1E1A16;--bw:3px;--bc:#1E1A16;--disp:'Pixelify Sans','Fredoka',system-ui,sans-serif;--ground:linear-gradient(180deg,#8ED3FF 0%,#C6ECFF 100%)}
:root[data-tier=grown]{--bg:#F4F5F7;--gink:#16181D;--ink:#16181D;--muted:#5E6573;--soft:#F1F3F6;--line:#E1E5EA;--pri:#2457E6;--pri-ink:#FFFFFF;--acc:#FFB300;--acc-ink:#16181D;--r:14px;--rs:10px;--edge:none;--bw:1px;--bc:#D5DAE1;--disp:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--ground:#F4F5F7}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--ground);background-color:var(--bg);color:var(--gink);font:500 17px/1.4 var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
:root[data-tier=grown] body{font-weight:400;font-size:16px;-webkit-user-select:text;user-select:text}
#app{height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #2457E6;outline-offset:2px}
[hidden]{display:none!important}
h1,h2{font-family:var(--disp);margin:0;line-height:1.08;letter-spacing:-.01em}
img,video{max-width:100%}
.screen{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:14px;padding:calc(10px + var(--st)) max(16px,var(--sr)) calc(18px + var(--sb)) max(16px,var(--sl));max-width:1240px;margin:0 auto}
.screen.fixed{overflow:hidden}
.grow{flex:1 1 auto}
.muted{color:var(--muted)}
.emo{display:inline-block;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
canvas.blocky{display:block}
.top{display:flex;align-items:center;gap:8px;min-height:52px;flex:none}
.top h1{font-size:clamp(22px,5.6vw,34px);font-weight:700;color:var(--gink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--ink);box-shadow:var(--edge);border:var(--bw) solid var(--bc)}
.ibtn svg{width:24px;height:24px}
.ibtn:active{transform:translateY(3px);box-shadow:none}
.ibtn[disabled]{opacity:.35}
.ibtn.sm{width:40px;height:40px;box-shadow:none;background:var(--soft)}
.ibtn.sm svg{width:20px;height:20px}
.av-btn{overflow:hidden}
.pill{flex:none;display:inline-flex;align-items:center;gap:5px;height:46px;padding:0 13px 0 7px;border-radius:999px;background:var(--card);color:var(--ink);box-shadow:var(--edge);border:var(--bw) solid var(--bc);font-family:var(--disp);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill svg{width:28px;height:28px;flex:none}
.pill.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.18)}}
:root[data-tier=builder] .ibtn,:root[data-tier=builder] .pill{border-radius:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 22px;border-radius:var(--rs);background:var(--card);color:var(--ink);font-family:var(--disp);font-weight:600;font-size:20px;line-height:1.15;text-align:center;box-shadow:var(--edge);border:var(--bw) solid var(--bc);text-decoration:none}
.btn svg{width:24px;height:24px;flex:none}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.pri{background:var(--pri);color:var(--pri-ink)}
.btn.big{min-height:70px;font-size:24px;border-radius:var(--r);width:100%}
.btn.small{min-height:46px;font-size:17px;padding:0 16px}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent}
.btn.danger{background:#D93636;color:#FFFFFF;border-color:#B42323}
.btn[disabled]{opacity:.45}
:root[data-tier=grown] .btn{font-size:16px;min-height:44px;border-radius:10px}
:root[data-tier=grown] .btn.pri{border-color:var(--pri)}
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btns.end{justify-content:flex-end}
.btns.col{flex-direction:column;align-items:stretch}
.card{background:var(--card);color:var(--ink);border-radius:var(--r);padding:16px;box-shadow:var(--edge);border:var(--bw) solid var(--bc)}
.lbl{display:block;font-weight:600;font-size:16px;color:var(--muted);margin:0 0 8px}
/* welcome */
.welcome{align-items:center;text-align:center;justify-content:center}
.wel-art{position:relative;width:min(100%,600px);aspect-ratio:1.35;flex:none;border-radius:var(--r);overflow:hidden;box-shadow:var(--edge);background:#6CC6EE}
.wcv{position:absolute;inset:0;width:100%;height:100%;display:block}
.wel-title{font-size:clamp(40px,10vw,64px);font-weight:700;color:var(--gink)}
.wel-sub{font-size:20px;max-width:32ch;margin:0}
.welcome .btn.big{max-width:420px}
.fine{font-size:15px;max-width:44ch;margin:0;opacity:.85}
/* new kid */
.form input[type=text]{width:100%;height:58px;border-radius:var(--rs);border:3px solid var(--soft);background:var(--soft);padding:0 16px;font-size:22px;font-weight:600;font-family:var(--disp);color:var(--ink);-webkit-user-select:text;user-select:text}
.form input[type=text]:focus{border-color:var(--pri);outline:none;background:#FFFFFF}
.ages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.age{height:56px;border-radius:var(--rs);background:var(--soft);color:var(--ink);font-family:var(--disp);font-weight:700;font-size:22px;border:var(--bw) solid var(--bc)}
.age.on{background:var(--pri);color:var(--pri-ink)}
.tierline{margin:12px 0 0;font-size:16px;color:var(--muted)}
.avs{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px}
.av{aspect-ratio:1;border-radius:var(--rs);background:var(--soft);display:grid;place-items:center;border:3px solid transparent}
.av.on{border-color:var(--pri);background:#FFFFFF}
.av .emo{font-size:44px!important}
/* who's practicing */
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.kid-tile{background:var(--card);color:var(--ink);border-radius:var(--r);padding:18px 10px;display:grid;justify-items:center;gap:8px;box-shadow:var(--edge);border:var(--bw) solid var(--bc);font-family:var(--disp);font-size:22px}
.kid-tile .emo{font-size:68px!important}
.kt-st{display:inline-flex;align-items:center;gap:4px;font-size:16px;color:var(--muted)}
.kt-st svg{width:22px;height:22px}
/* home */
.home{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.island-card{position:relative;height:clamp(220px,34vh,560px);border-radius:var(--r);overflow:hidden;box-shadow:var(--edge);border:var(--bw) solid var(--bc);background:#6CC6EE}
.island-card .tag{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.94);color:#1E2A33;font-family:var(--disp);font-weight:700;font-size:17px;padding:6px 12px;border-radius:999px}
.island-card .go{position:absolute;right:12px;bottom:12px;width:auto;min-height:56px;font-size:20px}
.practice-card{display:grid;gap:14px}
.pc-head{display:flex;align-items:center;gap:12px}
.pc-head h2{font-size:26px}
.pc-head p{margin:4px 0 0;font-size:16px}
.ring{flex:none;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p) * 360deg),var(--soft) 0);display:grid;place-items:center}
.ring span{width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:16px}
.ex-chips{display:flex;flex-wrap:wrap;gap:8px}
.ex-chip{position:relative;width:60px;height:60px;border-radius:var(--rs);background:var(--soft);padding:4px;border:var(--bw) solid var(--bc)}
.ex-chip.done{background:#DDF5E8}
.ex-chip .tick{position:absolute;right:-6px;top:-6px;width:26px;height:26px;border-radius:50%;background:var(--ok);color:#FFFFFF;display:grid;place-items:center}
.ex-chip .tick svg{width:16px;height:16px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tile{min-height:64px;font-size:20px;padding:0 12px}
.tile .emo{font-size:26px!important}
.tile canvas.blocky{width:30px;height:30px}
.tile-l{display:inline-flex;align-items:center;gap:10px}
.tile-art{display:none;align-items:flex-end;justify-content:center;gap:0}
.tile-art canvas{width:76px;height:76px}
.tile-art canvas.blocky{width:96px;height:96px}
.tile-art .emo{font-size:80px!important}
.week-card{display:grid;gap:10px;align-content:center}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.week .d{display:grid;justify-items:center;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.week .dot{width:36px;height:36px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.week .dot svg{width:24px;height:24px}
.week .dot.done{background:#FFE3B8}
.week .dot.part{background:repeating-linear-gradient(45deg,#FFE3B8 0 5px,var(--soft) 5px 10px)}
.week .dot.today{box-shadow:0 0 0 3px var(--pri)}
:root[data-tier=builder] .week .dot,:root[data-tier=builder] .ex-chip .tick{border-radius:4px}
.streak-note{margin:0;font-weight:600;font-size:16px}
@media (min-width:700px) and (orientation:portrait){.island-card{height:38vh}}
@media (min-width:900px) and (orientation:landscape){
.home{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;flex:1}
.island-card{grid-row:1 / 4;height:auto;min-height:420px}
.row2 .tile{flex-direction:column;justify-content:center;height:100%;min-height:150px;gap:8px}
.tile-art{display:flex}
.tile-l svg,.tile-l .emo,.tile-l canvas{display:none}
.buddy-s{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);grid-auto-rows:min-content;align-content:start;column-gap:16px}
.buddy-s>.top{grid-column:1 / -1}
.buddy-s>.buddy-hero{grid-column:1;grid-row:2 / span 3;align-self:start;padding-top:40px}
.buddy-s>.card,.buddy-s>.btn{grid-column:2}
}
@media (min-width:700px){.steps{font-size:19px}.demo-btns .btn{font-size:16px}}
@media (max-width:430px){.top{gap:6px}.pill{height:42px;padding:0 10px 0 6px;font-size:17px}.pill svg{width:24px;height:24px}.top h1{font-size:21px}.ex-pos{font-size:14px}}
/* practice screen */
.ex-s{gap:10px}
.ex-pos{flex:none;font-family:var(--disp);font-weight:600;font-size:16px;color:var(--gink);opacity:.85;white-space:nowrap}
.demo{flex:none;display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:12px;align-items:center;background:var(--card);color:var(--ink);border-radius:var(--r);padding:10px 14px 10px 10px;box-shadow:var(--edge);border:var(--bw) solid var(--bc)}
.demo-media{position:relative;aspect-ratio:1;width:100%;max-height:27vh;margin:auto;background:var(--soft);border-radius:var(--rs);overflow:hidden}
.demo-media .face{position:absolute;left:4%;top:4%;width:92%;height:92%}
.vidbox{position:absolute;inset:0;background:#000000}
.vidbox video,.vidbox iframe{width:100%;height:100%;object-fit:cover;border:0;display:block}
.demo-media.vid .face{display:none}
.demo-media:not(.vid) .vidbox{display:none}
.steps{margin:0 0 8px;padding-left:1.25em;display:grid;gap:3px;font-size:16px;line-height:1.28}
.steps li::marker{font-weight:700;color:var(--pri)}
:root[data-tier=explorer] .steps li::marker{color:#D86A06}
:root[data-tier=builder] .steps li::marker{color:#2F7A20}
.demo-btns{display:flex;flex-wrap:wrap;gap:8px}
.demo-btns .btn{min-height:44px;font-size:15px;padding:0 12px;box-shadow:none;background:var(--soft)}
.mirror{position:relative;flex:1 1 auto;min-height:190px;border-radius:var(--r);overflow:hidden;background:#BFE3FA;box-shadow:var(--edge);border:var(--bw) solid var(--bc)}
:root[data-tier=little] .mirror{border:6px solid #FFC531}
:root[data-tier=explorer] .mirror{border:5px solid #FFD43B}
.mirror video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.mirror-off{position:absolute;inset:0;display:grid;place-items:center;padding:16px 70px;text-align:center;background:linear-gradient(160deg,#E8F7FF,#BFE3FA);color:#1F3A4A}
.mo-in{display:grid;justify-items:center;gap:8px;max-width:320px}
.mo-in p{margin:0;font-size:16px;font-weight:600}
.mo-in .emo{font-size:50px!important}
.mo-in .btn{box-shadow:none}
.cam-x{position:absolute;right:10px;top:10px;z-index:3}
.count{position:absolute;left:10px;top:10px;z-index:2;display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:calc(100% - 80px);background:rgba(255,255,255,.94);color:#1E2A33;border-radius:18px;padding:6px 12px;font-family:var(--disp)}
:root[data-tier=builder] .count{border-radius:4px;border:3px solid #1E1A16}
.count b{font-size:34px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.count small{font-size:16px;font-weight:600}
.dots{display:flex;flex-wrap:wrap;gap:4px;max-width:260px}
.dots i{width:12px;height:12px;border-radius:50%;background:#D5DDE3}
.dots i.on{background:var(--acc);box-shadow:inset 0 0 0 2px rgba(0,0,0,.1)}
.hr{position:relative;width:58px;height:58px;display:grid;place-items:center}
.hr svg{position:absolute;inset:0;transform:rotate(-90deg)}
.hr circle{fill:none;stroke-width:10}
.hr .bg{stroke:#D5DDE3}
.hr .fg{stroke:var(--ok);stroke-dasharray:263.9;stroke-linecap:round}
.hr b{position:relative;font-size:24px}
.controls{flex:none;display:grid;gap:6px}
.ctl-row{display:flex;gap:10px}
.btn.sq{width:70px;min-height:70px;padding:0;flex:none;border-radius:var(--r)}
.hint{margin:0;text-align:center;font-size:15px;color:var(--gink);opacity:.9}
.done-panel{background:var(--card);color:var(--ink);border-radius:var(--r);padding:12px;display:grid;gap:10px;box-shadow:var(--edge);border:var(--bw) solid var(--bc)}
.dp-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dp-praise{font-family:var(--disp);font-size:26px}
.gain{display:inline-flex;align-items:center;gap:4px;font-family:var(--disp);font-weight:700;font-size:22px;color:var(--ink);white-space:nowrap}
.gain svg{width:26px;height:26px}
.rate{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rate span{font-weight:600;margin-right:auto}
.rate-b{width:54px;height:54px;border-radius:50%;font-size:32px;line-height:1;background:var(--soft);border:3px solid transparent;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.rate-b.on{border-color:var(--pri);background:#FFFFFF}
@media (min-width:760px) and (orientation:landscape){
.ex-s{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);grid-template-rows:auto minmax(0,1fr) auto;column-gap:16px}
.ex-s>.top{grid-column:1 / -1}
.ex-s .demo{grid-column:1;grid-row:2 / 4;grid-template-columns:minmax(0,1fr);align-content:center;align-self:stretch;padding:16px}
.ex-s .demo-media{max-height:none;width:min(100%,50vh)}
.ex-s .mirror{grid-column:2;grid-row:2}
.ex-s .controls{grid-column:2;grid-row:3}
.steps{font-size:19px}
}
/* mirror games */
.game{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.g-balloon{position:absolute;right:3%;bottom:3%;width:24%;max-width:140px;aspect-ratio:100 / 160}
.g-balloon svg{width:100%;height:100%;overflow:visible}
.g-balloon .bb{transform-box:view-box;transform-origin:50px 117px;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.g-balloon.wig,.g-rocket.wig{animation:wig .4s}
.g-balloon.popped svg{opacity:0;transition:opacity .08s}
@keyframes wig{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.pop{position:absolute;width:10px;height:14px;border-radius:3px;animation:popf 1.2s cubic-bezier(.2,.8,.4,1) forwards}
@keyframes popf{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r));opacity:0}}
.g-rocket{position:absolute;left:4%;bottom:3%;width:17%;max-width:90px;aspect-ratio:60 / 124;transition:transform 1.5s cubic-bezier(.55,0,.8,.3)}
.g-rocket svg{width:100%;height:100%;overflow:visible}
.g-rocket .fl{transform-box:view-box;transform-origin:30px 84px;transform:scaleY(.2);transition:transform .3s}
.g-rocket.launch{transform:translateY(-130vh)}
.g-rocket.launch .fl{transform:scaleY(1.6)!important}
.g-fuel{position:absolute;right:12px;top:72px;bottom:14px;width:20px;border-radius:12px;background:rgba(255,255,255,.8);border:3px solid #14323A;overflow:hidden}
.g-fuel i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#FFD43B,#FF9F1C);transition:height .3s}
.g-power{position:absolute;left:3%;right:3%;bottom:4%;display:flex;gap:4px;padding:5px;background:rgba(30,26,22,.8);border:3px solid #1E1A16;border-radius:4px}
.g-power i{flex:1;height:18px;background:#4A433C;border-radius:2px}
.g-power i.on{background:#7CDB5A;box-shadow:inset 0 -5px 0 #3FA34D}
.g-power.wig{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

}

}

    for (let i = 0; i < c.length; i++) if (c[i].o && ITEM[c[i].o] && ITEM[c[i].o].pet && !this.hops.has(i)) pets.push(i);
    if (!pets.length) return;
    const i = choice(pets), x = i % n, y = (i / n) | 0;
    const opts = DIRS.map(([dx, dy]) => [x + dx, y + dy]).filter(([X, Y]) => this.walkable(X, Y) && !this.cell(X, Y).o && !this.onAv(X, Y));
    if (!opts.length) return;
    const [X, Y] = choice(opts), j = Y * n + X; c[j].o = c[i].o; c[i].o = null; this.hops.set(j, { fx: x, fy: y, t: 0 }); saveSoon();
  }
  update(dt) {
    this.time += dt; const a = this.av;
    if (a.path.length) {
      if (a.prog === 0 && !this.walkable(a.path[0][0], a.path[0][1])) { const g = a.goal; a.path = []; if (g) { const p = this.findPath(a.x, a.y, g[0], g[1]); if (p) a.path = p; } if (!a.path.length) this.arrive(); }
      if (a.path.length) {
        const [nx, ny] = a.path[0], d = nx - a.x - (ny - a.y); if (d) a.dir = d > 0 ? 1 : -1;
        a.prog += dt * 3.6; a.walk += dt * 13;
        if (a.prog >= 1) { a.x = nx; a.y = ny; a.prog = 0; a.path.shift(); if (!a.path.length) this.arrive(); }
      }
    }
    a.fx = a.path.length ? a.x + (a.path[0][0] - a.x) * a.prog : a.x; a.fy = a.path.length ? a.y + (a.path[0][1] - a.y) * a.prog : a.y;
    if (this.prev && !a.path.length) {
      this.wander -= dt;
      if (this.wander <= 0) { this.wander = 3 + Math.random() * 4; const n = this.w.n; for (let k = 0; k < 12; k++) { const x = clamp(a.x + Math.round((Math.random() - 0.5) * 6), 0, n - 1), y = clamp(a.y + Math.round((Math.random() - 0.5) * 6), 0, n - 1); if ((x !== a.x || y !== a.y) && this.walkable(x, y) && this.walkTo(x, y, true)) break; } }
    }
    if (this.mode !== 'build') { this.hopT -= dt; if (this.hopT <= 0) { this.hopT = 1.6 + Math.random() * 2.6; this.hop(); } }
    for (const [i, h] of this.hops) { h.t += dt * 2.4; if (h.t >= 1) this.hops.delete(i); }
    for (const p of this.parts) p.t += dt; this.parts = this.parts.filter(p => p.t < p.life);
    if (this.mark) { this.mark.t += dt; if (this.mark.t > 0.6) this.mark = null; }
    if (!this.prev && this.follow && a.path.length) {
      const [cx, cy] = this.center(a.fx, a.fy), mx = this.W * 0.22, my = this.H * 0.25; let dx = 0, dy = 0;
      if (cx < mx) dx = mx - cx; else if (cx > this.W - mx) dx = this.W - mx - cx;
      if (cy < my) dy = my - cy; else if (cy > this.H - my) dy = this.H - my - cy;
      if (dx || dy) { const f = Math.min(1, dt * 4); this.px += dx * f; this.py += dy * f; this.layout(); }
    }
  }
  loop(ts) {
    if (!this.alive) return;
    const dt = this.last ? Math.min(0.05, (ts - this.last) / 1000) : 0; this.last = ts;
    if (this.W) { this.update(dt); this.draw(); }
    this.raf = requestAnimationFrame(this.loop);
  }
  avIndex() {
    const a = this.av, n = this.w.n; if (!a.path.length) return a.y * n + a.x;
    const [nx, ny] = a.path[0]; return nx + ny > a.x + a.y || (nx + ny === a.x + a.y && nx > a.x) ? ny * n + nx : a.y * n + a.x;
  }
  drawAv() {
    const a = this.av, c = this.ctx, u = this.u, [cx, cy] = this.center(a.fx, a.fy), moving = a.path.length > 0;
    const bob = moving ? Math.abs(Math.sin(a.walk)) * 3 * u : Math.sin(this.time * 2.2) * 1.2 * u;
    shadow(c, cx, cy + 1 * u, 13 * u, 5.5 * u);
    const av = this.k.avatar;
    if (av && av.t === 'b') drawBlocky(c, cx, cy - bob * 0.4, u * 1.08, av, moving ? a.walk : 0, a.dir < 0);
    else { const s = 38 * u; drawEmoji(c, (av && av.e) || '🙂', cx, cy - s * 0.5 - bob, s, this.dpr, a.dir > 0); }
  }
  draw() {
    const c = this.ctx, W = this.W, H = this.H, n = this.w.n, u = this.u, t = this.time, cells = this.w.c, T = this.T, D = 10 * u;
    if (!W || !T) return;
    c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#8FD9F7'); g.addColorStop(1, '#4AB0E2'); c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.fillStyle = 'rgba(255,255,255,.32)';
    for (let i = 0; i < 16; i++) { const sx = ((i * 137.5 + t * 7 * ((i % 3) + 1)) % (W + 60)) - 30, sy = (i * 61.3 + 17) % H; c.fillRect(sx, sy, Math.max(6, 12 * u), 1.6); }
    const ai = this.avIndex(), build = this.mode === 'build' && !this.prev;
    for (let s = 0; s <= 2 * (n - 1); s++) {
      for (let x = Math.max(0, s - n + 1); x <= Math.min(n - 1, s); x++) {
        const y = s - x, i = y * n + x, cell = cells[i], [cx, cy] = this.center(x, y);
        if (cx < -T || cx > W + T || cy < -T * 0.6 || cy > H + T * 2.2) { if (i === ai) this.drawAv(); continue; }
        if (cell.g === 'water' || cell.g === 'bridge') { drawWater(c, cx, cy + D * 0.8, u, t, x, y); if (cell.g === 'bridge') drawBridge(c, cx, cy, u); }
        else drawLand(c, cell.g, cx, cy, u, t, i * 7 + 3);
        if (build) poly(c, dia(cx, cell.g === 'water' ? cy + D * 0.8 : cy, 1, 1, u), null, 'rgba(255,255,255,.35)', Math.max(1, u));
        if (this.mark && this.mark.x === x && this.mark.y === y) poly(c, dia(cx, cell.g === 'water' ? cy + D * 0.8 : cy, 0.96, 0.96, u), `rgba(255,255,255,${(0.55 * (1 - this.mark.t / 0.6)).toFixed(3)})`);
        for (let b = 0; b < cell.s.length; b++) { const it = ITEM[cell.s[b]]; if (it) drawBlock(c, it, cx, cy - b * 29 * u, u); }
        if (cell.o && ITEM[cell.o]) {
          const it = ITEM[cell.o]; let ox = cx, oy = cy; const h = this.hops.get(i);
          if (h) { const [px, py] = this.center(h.fx, h.fy), e = 1 - Math.pow(1 - h.t, 2); ox = px + (cx - px) * e; oy = py + (cy - py) * e - Math.sin(h.t * Math.PI) * 10 * u; }
          if (it.water) oy += D * 0.8 + Math.sin(t * 2 + x) * 1.5 * u;
          drawObj(c, it, ox, oy, u, t, this.dpr, i);
        }
        if (i === ai) this.drawAv();
      }
    }
    for (const p of this.parts) {
      if (p.t < 0) continue; const [cx, cy] = this.center(p.x, p.y), k = p.t / p.life;
      c.globalAlpha = 1 - k; drawEmoji(c, p.e, cx + p.dx * u, cy - 40 * u - k * 34 * u, 20 * u, this.dpr); c.globalAlpha = 1;
    }
  }
}

  for (let i = 6; i >= 0; i--) {

  }
  return h + '</div>';
}

function summaryText(k) {

  let s = `Practice Island update for ${k.name} (age ${k.age})\n${fmt(last7[0])} to ${fmt(t)}: whole plan done on ${p7} of 7 days. Streak ${streak(k)} days, best ${k.best || 0}.\n`;
  for (const e of k.plan) {
    let n = 0; const R = { easy: 0, ok: 0, hard: 0 };
    last7.forEach(d => { const r = k.log[d] && k.log[d].ex[e.id]; if (r) { n += r.n; r.r.forEach(v => { R[v] = (R[v] || 0) + 1; }); } });

}

  e.steps = e.steps.map(s => (s || '').trim()).filter(Boolean); if (!e.steps.length) e.steps = ['Watch the demo, then try it.'];
  if (g.blob) { try { await IDB.put(e.id, g.blob); } catch (err) { toast("Couldn't save the video on this device"); e.video = null; } }
  else if (g.delVid) IDB.del(e.id).catch(() => {});
  if (g.isNew) k.plan.push(e); else { const i = k.plan.findIndex(x => x.id === e.id); if (i >= 0) k.plan[i] = e; }
  save(); toast('Saved'); go('gkid', { id: k.id });
};
actions.exDel = () => {
  const k = GK, e = GE && GE.e; if (!k || !e) return;
  ask(`Delete ${e.name || 'this exercise'}?`, 'It comes off the plan. Past progress stays in the history.', 'Delete', () => { k.plan = k.plan.filter(x => x.id !== e.id); IDB.del(e.id).catch(() => {}); save(); go('gkid', { id: k.id }); }, true);
};

// ===== Wiring and start-up =====
actions.go = el => go(el.dataset.to, Object.assign({}, el.dataset));
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = actions[el.dataset.act]; if (!f) return;
  e.preventDefault();
  try { f(el, e); } catch (err) { console.error(err); }
});
document.addEventListener('change', e => { const el = e.target.closest('[data-ch]'); if (el && changes[el.dataset.ch]) { try { changes[el.dataset.ch](el, e); } catch (err) { console.error(err); } } });
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && inputs[el.dataset.in]) inputs[el.dataset.in](el, e); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && curModal && !curModal.classList.contains('locked')) closeModal();
  if (e.key === 'Enter' && e.target && e.target.id === 'nkName') actions.nkGo();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { save(); if (X && X.camOn) { camStop(); X.camResume = true; } }
  else if (X && X.camResume && curName === 'ex' && !X.dead) { X.camResume = false; camStart(); }
});
window.addEventListener('pagehide', () => save());

function start(data) {
  const d = data && data.v === 1 && Array.isArray(data.kids) ? data : null;
  S = d || load() || defaults(); normalize();
  try { const H = window.claude && window.claude.hot; if (H && H.snapshot) H.snapshot(() => S); } catch (e) { /* not in a live preview */ }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* ok */ }
  let pp = null;
  try { if (/PI1\./.test(location.hash)) { pp = parsePlan(decodeURIComponent(location.hash)); history.replaceState(null, '', location.pathname + location.search); } } catch (e) { pp = null; }
  if (!S.kids.length) go('welcome'); else if (S.kids.length === 1) { S.active = S.kids[0].id; go('home'); } else go('pick');
  if (pp) { if (S.kids.length) gate(() => { go('g'); planImportModal(pp); }); else { PENDING_PLAN = pp; toast('A practice plan is ready. Add a kid to use it.'); } }
}
try {
  const H = window.claude && window.claude.hot;
  if (H && H.ready) H.ready(start); else start((H && H.data) || {});
} catch (e) { console.error(e); if (!S) start({}); }

})();
</script>
